name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # The backends are found at run time, so the tests do not need GStreamer or FFmpeg
      # installed; the two renderer tests are ignored for the same reason.
      - name: Run the tests
        run: cargo test --locked

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The plugin links GStreamer, which the test job does not install; a job of its own
      # builds it where the development files are available.
      - name: Build the release binary
        run: cargo build --release --locked

  # The version in Cargo.toml is a promise; this is the job that keeps it.
  msrv:
    name: rust 1.95
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the oldest supported Rust
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Check the workspace builds on the declared version
        run: cargo check --locked --all-targets
  # The GStreamer backend is a cdylib that links the development files of GStreamer. The
  # job is separate because those files are a large install and only this crate needs them.
  plugin:
    name: GStreamer plugin
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install GStreamer (MSYS2)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Point pkg-config at GStreamer
        shell: pwsh
        run: |
          $msys2 = '${{ steps.msys2.outputs.msys2-location }}'
          if (-not $msys2) { $msys2 = 'C:\msys64' }
          $prefix = Join-Path $msys2 'ucrt64'
          (Join-Path $prefix 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PKG_CONFIG=$(Join-Path $prefix 'bin\pkg-config.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$(Join-Path $prefix 'lib\pkgconfig')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Build the plugin
        run: cargo build --release --locked -p parlor-gst-backend

      # The release archive is one executable, so the program is built after the plugin and
      # embeds it. This job is the one place that proves that link of the build works.
      - name: Build the program with the plugin inside it
        run: cargo build --release --locked -p parlor-desktop